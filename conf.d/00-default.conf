# Catch-all default_server block.
#
# Without this, nginx falls back to the FIRST server block it parses for a
# given port whenever a client connects with no SNI, or an SNI/Host that
# doesn't match any of our real vhosts (blackbook.conf, futumore.conf, etc.).
# That means such clients silently get served one of our real domains'
# TLS certificates and content — which looks exactly like a browser cert
# mismatch error (ERR_CERT_COMMON_NAME_INVALID) on the client's end, and
# leaks which other sites we host.
#
# This block explicitly claims "default_server" on both 80 and 443, so any
# unmatched request is closed instead of falling through to a real vhost.

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;

    # Throwaway self-signed cert used ONLY to complete the TLS handshake
    # for unmatched SNI. Never a real domain cert — generate once on the
    # host, do not commit the .key to git (see certs/default-selfsigned/.gitignore).
    ssl_certificate     /etc/nginx/certs/default-selfsigned/default.crt;
    ssl_certificate_key /etc/nginx/certs/default-selfsigned/default.key;

    return 444;
}
